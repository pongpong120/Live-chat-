<body>
  <div id="root"></div>
  
  <script src="/recharge-package-state.js"></script>
  <script>
(function(){
  const nativeFetch=window.fetch.bind(window);
  window.fetch=function(input,init){
    init=init?{...init}:{ };
    const h=new Headers(init.headers||{});
    const t=(window.parent&&window.parent!==window?window.parent.localStorage.getItem("pp_auth_token"):localStorage.getItem("pp_auth_token"))||"";
    if(t&&!h.has("Authorization")) h.set("Authorization","Bearer "+t);
    if(!init.credentials) init.credentials="include";
    init.headers=h;
    return nativeFetch(input,init);
  };
  window.__ppOpenPaymentApp=function(link,method){
    if(!link) return false;
    const generic=link.replace(/^phonepe:\/\/pay\?/i,"upi://pay?").replace(/^paytmmp:\/\/pay\?/i,"upi://pay?").replace(/^tez:\/\/upi\/pay\?/i,"upi://pay?");
    const preferred=method==="phonepe"||method==="paytm"||method==="gpay"?link:generic;
    let launched=false;
    const mark=()=>{launched=true;};
    document.addEventListener("visibilitychange",mark,{once:true});
    window.addEventListener("pagehide",mark,{once:true});
    const a=document.createElement("a");
    a.href=preferred; a.style.display="none"; a.rel="noopener";
    document.body.appendChild(a);
    try{a.click();}catch(e){try{window.location.href=preferred;}catch(_){}}
    setTimeout(function(){
      if(!launched){
        try{window.location.href=preferred;}catch(e){}
        setTimeout(function(){if(!launched){try{window.location.href=generic;}catch(e){}}},500);
      }
      try{a.remove();}catch(e){}
    },500);
    return true;
  };

<script>
(function(){
  function normalizeUpiLink(link){
    return String(link||'').replace(/^phonepe:\/\/pay\?/i,'upi://pay?').replace(/^paytmmp:\/\/pay\?/i,'upi://pay?').replace(/^tez:\/\/upi\/pay\?/i,'upi://pay?');
  }
  function launchSelectedApp(link, method){
    const generic=normalizeUpiLink(link);
    if(!/^upi:\/\/pay\?/i.test(generic)) throw new Error('Server returned an unsupported UPI payment link.');
    const packages={phonepe:'com.phonepe.app',gpay:'com.google.android.apps.nbu.paisa.user',paytm:'net.one97.paytm'};
    const query=generic.split('?').slice(1).join('?');
    if(/Android/i.test(navigator.userAgent)&&method!=='upi'&&packages[method]&&query){
      window.location.href='intent://pay?'+query+'#Intent;scheme=upi;package='+packages[method]+';end';
      window.setTimeout(function(){if(!document.hidden)window.location.href=generic;},900);return;
    }
    window.location.href=generic;
  }
  function showChooser(){
    if(document.getElementById('pp-upi-choice-overlay'))return;
    const overlay=document.createElement('div');overlay.id='pp-upi-choice-overlay';
    overlay.style.cssText='position:fixed;inset:0;z-index:2147483647;background:#f0f1f6;overflow:auto;padding:0;font-family:system-ui,-apple-system,sans-serif;color:#263247;';
    const panel=document.createElement('div');panel.style.cssText='max-width:520px;min-height:100%;margin:auto;padding:0 22px 28px;background:#f0f1f6;';
    panel.innerHTML=`<header style="height:64px;margin:0 -22px 24px;background:#ffbf00;color:white;display:flex;align-items:center;justify-content:center;position:relative;font-size:21px;font-weight:800"><button data-close aria-label="Back" style="position:absolute;left:18px;color:white;font-size:30px;line-height:1">‹</button>Maza</header><section style="background:#fff;border-radius:12px;padding:26px 0 28px;box-shadow:0 5px 18px #15223a0b"><div style="padding:0 24px 24px"><div data-amount style="font-size:38px;font-weight:800;color:#050505;line-height:1.2">Preparing payment…</div><div style="display:flex;gap:8px;align-items:center;margin-top:20px;color:#9ca3af;font-size:14px;overflow-wrap:anywhere"><span>Order ID:</span><b data-order style="font-weight:500;flex:1"></b><button data-copy style="font-size:18px;color:#6b7280">▣</button></div><div style="font-size:18px;margin-top:30px;color:#263247">Select an option to pay (UPI)</div></div><div data-methods></div><div style="padding:26px 24px 0"><button data-pay disabled style="width:100%;height:56px;border-radius:13px;background:#7b3fc5;color:#fff;font-size:20px;font-weight:800;opacity:.55">Pay</button><p data-status role="status" style="font-size:12px;line-height:1.5;color:#6b7280;margin-top:14px">Preparing secure payment details…</p></div></section><div style="font-size:14px;line-height:1.7;color:#6b7280;margin-top:24px"><b style="color:#263247">Payment prompt:</b><p style="margin-top:8px">Choose the UPI app installed on your phone and pay the exact amount shown. Returning to PingPong does not confirm payment; diamonds are credited only after server verification.</p></div>`;
    const status=panel.querySelector('[data-status]'), methods=panel.querySelector('[data-methods]'), pay=panel.querySelector('[data-pay]');
    const orderMatch=(document.body.innerText.match(/PP-[A-Z0-9-]{8,}/i)||[])[0];
    let selected='phonepe',paymentData=null;
    const methodRows=[['phonepe','PhonePe','🟪'],['paytm','Paytm','🔷'],['gpay','Google Pay','🟢'],['upi','Other UPI','🏦']];
    methodRows.forEach(([id,label,emoji])=>{
      const row=document.createElement('button');row.type='button';row.dataset.method=id;
      row.style.cssText='width:100%;min-height:76px;display:flex;align-items:center;gap:18px;padding:14px 24px;border-top:1px solid #e5e7eb;background:#fff;text-align:left;color:#435067;font-size:17px';
      row.innerHTML='<span style="width:46px;height:46px;display:grid;place-items:center;font-size:27px">'+emoji+'</span><span style="flex:1">'+label+'</span><span data-check style="width:22px;height:22px;border:2px solid #d1d5db;border-radius:50%;display:grid;place-items:center;font-size:13px"></span>';
      row.addEventListener('click',()=>{selected=id;methods.querySelectorAll('[data-method]').forEach(el=>{const on=el.dataset.method===selected;el.style.background=on?'#faf7ff':'#fff';const check=el.querySelector('[data-check]');check.style.borderColor=on?'#27996b':'#d1d5db';check.style.background=on?'#27996b':'#fff';check.style.color='#fff';check.textContent=on?'✓':'';});});
      methods.appendChild(row);
    });
    panel.querySelector('[data-close]').addEventListener('click',()=>overlay.remove());
    overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});

    overlay.appendChild(panel);document.body.appendChild(overlay);
    if(!orderMatch){status.textContent='Could not identify the current recharge order. Close and reopen Recharge.';return;}
    panel.querySelector('[data-order]').textContent=orderMatch;
    fetch('/api/wallet/recharge/order/'+encodeURIComponent(orderMatch)+'/payment-data',{credentials:'include'})
      .then(r=>r.json()).then(data=>{
        if(!data||!data.success||!data.upiLink||String(data.orderId)!==String(orderMatch))throw new Error(data&&data.message||'Payment link is unavailable for this order.');
        // The server-issued order is authoritative for the amount. Do not
        // compare against document.body.innerText: the underlying wallet's
        // package cards may contain other prices before this overlay in DOM order.
        paymentData=data;panel.querySelector('[data-amount]').textContent='₹'+Number(data.amountINR).toFixed(2);status.textContent='Select your payment app, then tap Pay.';pay.disabled=false;pay.style.opacity='1';
        methods.querySelector('[data-method="phonepe"]').click();
      }).catch(err=>{status.textContent=err.message||'Could not prepare payment link. Please try again.';});
  }
  document.addEventListener('click',function(e){const b=e.target&&e.target.closest&&e.target.closest('button');if(!b||!(/Open PhonePe \/ UPI App/i.test(b.textContent||'')))return;e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();showChooser();},true);
})();
</script>
