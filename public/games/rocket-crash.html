body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(36,12,104,.82),rgba(44,16,128,.66) 55%,rgba(80,28,160,.5));pointer-events:none}
button{font-family:inherit;color:inherit;cursor:pointer}
.app{position:relative;z-index:1;width:100%;max-width:none;height:100%;max-height:100%;min-height:0;margin:0 auto;padding:2px 4px calc(3px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:3px;overflow:hidden;transform:none}
.dm{display:inline-block;height:1.15em;width:auto;vertical-align:-.2em;margin-right:.18em;filter:drop-shadow(0 0 4px #c9a7ff)}
.app-diamond-icon{width:1.2em;height:1.2em;object-fit:contain;vertical-align:-.22em;filter:drop-shadow(0 0 5px rgba(109,231,255,.82)) drop-shadow(0 0 11px rgba(156,99,255,.48))}

/* bracket corners */
.chip:after,#mult:before,#pwrap:before{content:"";position:absolute;pointer-events:none;background:linear-gradient(var(--bc),var(--bc)) 0 0/var(--l) var(--t),linear-gradient(var(--bc),var(--bc)) 0 0/var(--t) var(--l),linear-gradient(var(--bc),var(--bc)) 100% 0/var(--l) var(--t),linear-gradient(var(--bc),var(--bc)) 100% 0/var(--t) var(--l),linear-gradient(var(--bc),var(--bc)) 0 100%/var(--l) var(--t),linear-gradient(var(--bc),var(--bc)) 0 100%/var(--t) var(--l),linear-gradient(var(--bc),var(--bc)) 100% 100%/var(--l) var(--t),linear-gradient(var(--bc),var(--bc)) 100% 100%/var(--t) var(--l);background-repeat:no-repeat}
/* header */
#top{flex:none;position:relative;height:clamp(42px,7.2vh,62px);padding:5px 0 0;display:flex;justify-content:space-between;align-items:flex-start}
#top .frame{position:absolute;left:-6px;top:0;width:calc(100% + 12px);height:100%;pointer-events:none;overflow:visible}
#top .frame path{fill:none;stroke:#62e8ff;stroke-width:2.5;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 5px #35d8ff)}
.tri{position:absolute;top:34px;width:20px;height:18px;filter:drop-shadow(0 0 4px #35d8ff)}
.tri.l{left:24.5%}.tri.r{right:24.5%}
.tri polygon{fill:none;stroke:#62e8ff;stroke-width:2.2}
.ig{display:flex;gap:8px;position:relative;z-index:2}
.ib{position:relative;flex:none;width:42px;height:42px;padding:0;border-radius:50%;display:grid;place-items:center;border:2px solid #9272f6;background:radial-gradient(circle at 50% 28%,#5a34c4,#1d0b58 78%);box-shadow:0 0 0 2px rgba(20,8,70,.85),0 0 14px rgba(150,110,255,.65),inset 0 2px 3px rgba(255,255,255,.3);transition:transform .12s}
.ib:active{transform:scale(.92)}
.ib svg{width:23px;height:23px;filter:drop-shadow(0 0 5px #1ec8ff)}

<div id="modal"><div id="mc"><div id="mh"><div id="mT"></div><button id="mX">✕</button></div><div id="mB"></div></div></div>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const inFrame=window.parent&&window.parent!==window;
const fmt=n=>Math.floor(Number(n)||0).toLocaleString('en-US');
let phase='connecting',roundId=0,startsAt=0,serverOffset=0,lastMult=1,hasBet=false,myAmount=0,joinTries=0,joinTimer=null,selectedAmount=50000,soundOn=true,lastHistory=[];
const send=(event,payload)=>{if(inFrame)window.parent.postMessage({type:'pp-rocket-emit',event,payload},location.origin)};
function toast(t,kind=''){const el=$('msg');if(!el)return;el.textContent=t;el.className='show'+(kind?' '+kind:'');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.className='',2600)}
function setBalance(v){if(v==null||!Number.isFinite(Number(v)))return;const n=fmt(v);$('jpv').textContent=n;$('balp').innerHTML='<img class="dm app-diamond-icon" src="../images/icons/icon-diamond-premium.png" alt="">'+n;$('balp').classList.remove('flash');void $('balp').offsetWidth;$('balp').classList.add('flash')}
function join(){send('rocket:join');clearTimeout(joinTimer);joinTimer=setTimeout(()=>{if(phase==='connecting'&&joinTries<6){joinTries++;join()}else if(phase==='connecting')toast('Could not connect. Close and reopen the game.','err')},1500)}
function controls(){const canBet=phase==='waiting'&&!hasBet;document.querySelectorAll('.can').forEach(b=>b.disabled=!canBet);$('rebet').disabled=!canBet;$('cash').style.display=phase==='running'&&hasBet?'block':'none';$('cash').disabled=!(phase==='running'&&hasBet);$('autoOn').disabled=true;$('aM').disabled=true;$('aP').disabled=true}
function drawHistory(items){lastHistory=Array.isArray(items)?items.slice(0,8):[];const root=$('chips');root.replaceChildren();lastHistory.forEach(v=>{const n=Number(typeof v==='object'?(v.crashedAt??v.multiplier??v.value):v);if(!Number.isFinite(n))return;const e=document.createElement('div');e.className='chip '+(n<2?'r':n<10?'g':'p');e.textContent=n.toFixed(2)+'x';root.append(e)});if(!root.children.length){const e=document.createElement('div');e.className='chip';e.textContent='—';root.append(e)}}
function drawPlayers(){ $('plN').textContent=hasBet?'1':'0';$('youRow').style.display=hasBet?'flex':'none';$('youAmt').textContent=hasBet?fmt(myAmount):'';$('pbet').innerHTML=hasBet?'<b>YOUR BET</b> '+fmt(myAmount):'No active bet';$('pfoot').style.display='flex';}
function moveRocket(m){const fly=$('fly'),r=$('rocket');if(!fly||!r)return;const w=fly.clientWidth||300,h=fly.clientHeight||250;const p=Math.min(1,Math.max(0,Math.log(Math.max(1,m))/Math.log(20)));r.style.transform='translate3d('+Math.round(p*w*.58)+'px,'+Math.round(-p*h*.43)+'px,0)';r.classList.toggle('fly',phase==='running');r.classList.toggle('idle',phase!=='running')}
function applyRound(s){if(!s)return;const prevRound=roundId,prevPhase=phase;phase=s.phase||phase;roundId=s.roundId??roundId;startsAt=s.startsAt||0;serverOffset=(s.serverNow||Date.now())-Date.now();$('jpv').textContent=$('jpv').textContent||'—';$('count').textContent='12';$('main').classList.toggle('wait',phase==='waiting'||phase==='connecting');$('startLbl').textContent=phase==='waiting'?'NEXT ROCKET':'ROUND '+roundId;
 if(s.history)drawHistory(s.history);if(s.balance!=null)setBalance(s.balance);if(s.bet){hasBet=true;myAmount=Number(s.bet.amount)||myAmount}else if(roundId!==prevRound){hasBet=false;myAmount=0}
 if(roundId!==prevRound&&phase==='waiting'){$('rocket').classList.remove('boom');$('boom').style.opacity='0';$('mult').className='';$('mult').textContent='1.00x';$('fly').classList.remove('shake');$('rocket').style.transform='translate3d(0,0,0)'}
 if(phase==='waiting'){$('status').textContent=hasBet?'BET PLACED — WAITING FOR LAUNCH':'PLACE YOUR BET';$('fstat').textContent='ROUND #'+roundId;$('betPill').innerHTML=hasBet?'<b>BET</b> '+fmt(myAmount):'BET NOT PLACED'}
 else if(phase==='running'){$('main').classList.remove('wait');$('status').textContent=hasBet?'CASH OUT NOW!':'ROCKET IS FLYING';$('fstat').textContent='LIVE · ROUND #'+roundId;if(s.multiplier){lastMult=Number(s.multiplier)||1;$('mult').textContent=lastMult.toFixed(2)+'x';moveRocket(lastMult)}if(prevPhase!=='running')toast('Rocket launched!')}
 else if(phase==='crashed'){$('main').classList.remove('wait');const n=Number(s.crashedAt||lastMult);$('mult').className='crashed';$('mult').textContent=n.toFixed(2)+'x';$('status').textContent='ROCKET CRASHED';$('fstat').textContent='ROUND ENDED';$('boom').style.opacity='1';$('rocket').classList.remove('fly');$('rocket').classList.add('boom');$('fly').classList.add('shake');hasBet=false;if(prevPhase!=='crashed')toast('Round ended at '+n.toFixed(2)+'x','err')}
 drawPlayers();controls();}
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data;if(!d||d.type!=='pp-rocket-event')return;const p=d.payload||{};switch(d.event){
 case 'rocket:state':clearTimeout(joinTimer);joinTries=0;applyRound(p);toast(phase==='waiting'?'Place a bet before launch.':'Synced with live round.');break;
 case 'rocket:round':applyRound(p);break;
 case 'rocket:tick':if(p.roundId!==roundId||phase==='connecting')break;phase='running';lastMult=Number(p.multiplier)||1;serverOffset=(p.serverNow||Date.now())-Date.now();$('main').classList.remove('wait');$('mult').className='';$('mult').textContent=lastMult.toFixed(2)+'x';$('count').textContent='FLY';$('status').textContent=hasBet?'CASH OUT NOW!':'ROCKET IS FLYING';$('fstat').textContent='LIVE · ROUND #'+roundId;moveRocket(lastMult);controls();break;
 case 'rocket:action':if(p.balance!=null)setBalance(p.balance);if(p.ok){if(p.type==='bet'){hasBet=true;myAmount=Number(p.amount)||selectedAmount;toast(p.message||'Bet placed');}else if(p.type==='cashout'){hasBet=false;toast(p.message||'Cashed out successfully','ok')}drawPlayers()}else toast(p.message||'Action failed','err');controls();break;
 case 'rocket:result':hasBet=false;if(p.balance!=null)setBalance(p.balance);toast(p.message||'Round ended',p.won?'ok':'err');drawPlayers();controls();break;
 case 'rocket:balance':setBalance(p.balance);break;
 case 'rocket:bettors':break;
 case 'rocket:player-cashout':if(p.roundId===roundId&&!hasBet)toast((p.name||'A player')+' cashed out at '+Number(p.multiplier).toFixed(2)+'x');break;
 case 'rocket:unavailable':if(p.code==='AUTHENTICATION_REQUIRED'&&joinTries<6){joinTries++;setTimeout(join,1200);toast('Verifying your session…')}else{toast(p.message||'Rocket Crash unavailable','err');$('status').textContent='UNAVAILABLE'}break;
 case 'pp:connected':phase='connecting';joinTries=0;toast('Reconnected — syncing…');join();break;
 case 'pp:disconnected':phase='connecting';hasBet=false;controls();$('status').textContent='RECONNECTING…';toast('Connection lost — reconnecting…','err');break;
 case 'pp:stop':break;
 }});
document.querySelectorAll('.can').forEach(b=>b.addEventListener('click',()=>{selectedAmount=Math.floor(Number(b.dataset.amt)||50000);document.querySelectorAll('.can').forEach(x=>x.classList.toggle('sel',x===b));$('pbet').innerHTML='<b>SELECTED</b> '+fmt(selectedAmount)}));
$('rebet').addEventListener('click',()=>{if(phase!=='waiting'||hasBet)return;send('rocket:bet',{amount:selectedAmount});$('rebet').disabled=true});
$('cash').addEventListener('click',()=>{if(phase!=='running'||!hasBet)return;$('cash').disabled=true;send('rocket:cashout')});
function openModal(title,html){$('mT').textContent=title;$('mB').innerHTML=html;$('modal').classList.add('open')}
$('mX').addEventListener('click',()=>$('modal').classList.remove('open'));$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('open')});
$('bHelp').addEventListener('click',()=>openModal('HOW TO PLAY','<div class="hp"><p><b>1.</b> Select a bet amount before the countdown ends.</p><p><b>2.</b> The live server controls the round and multiplier.</p><p><b>3.</b> If you have an active bet, use CASH OUT before the rocket crashes.</p><p>Round results and account balance are provided by the PingPong server.</p></div>'));
$('bStats').addEventListener('click',()=>openModal('RECENT RESULTS',lastHistory.length?'<div class="hg">'+lastHistory.map(v=>{const n=Number(typeof v==='object'?(v.crashedAt??v.multiplier??v.value):v);return Number.isFinite(n)?'<div class="chip '+(n<2?'r':n<10?'g':'p')+'">'+n.toFixed(2)+'x</div>':''}).join('')+'</div>':'No completed rounds received yet.'));
$('bHist').addEventListener('click',()=>$('bStats').click());
$('snd').addEventListener('click',()=>{soundOn=!soundOn;$('snd').style.opacity=soundOn?'1':'.55';toast(soundOn?'Sound enabled':'Sound muted')});
$('bOnline').addEventListener('click',()=>toast('Connected players are synchronized by the server.'));
function leave(){send('rocket:leave')};window.addEventListener('pagehide',leave);document.addEventListener('visibilitychange',()=>{});
setInterval(()=>{if(phase==='waiting'){const left=Math.max(0,Math.ceil((startsAt-(Date.now()+serverOffset))/1000));$('count').textContent=left>0?String(left):'GO';$('count').classList.toggle('low',left<=3);$('barFill').style.width=(Math.max(0,Math.min(100,left/12*100)))+'%';$('clock').classList.toggle('low',left<=3);$('status').textContent=hasBet?'BET PLACED — WAITING FOR LAUNCH':'PLACE YOUR BET';$('fstat').textContent='ROUND #'+roundId}else if(phase==='running'){$('count').textContent='FLY';$('barFill').style.width='100%'}else if(phase==='crashed'){$('count').textContent='BOOM';}},200);
if(!inFrame){toast('Open Rocket Crash from inside the app.','err');$('status').textContent='OPEN FROM THE APP'}else{controls();drawPlayers();join()}
})();

</script>
