<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucky Fruit</title>
<style>
:root{--bg:#0b0820;--panel:#2a1f6b;--tile:#2a2a63;--gold:#ffcc33;--edge:#c9a227}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05030f;font-family:ui-rounded,system-ui,sans-serif;color:#fff}
#app{max-width:420px;margin:0 auto;min-height:100%;background:linear-gradient(#1a1445,#241a63 40%,#17113f);position:relative;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:#0c0820}
.pill{display:flex;align-items:center;gap:8px;border:2px solid var(--edge);border-radius:99px;background:#1c1450;padding:2px 4px 2px 8px;font-weight:700}
.pill b{min-width:50px;text-align:center;font-size:14px}
.plus{width:24px;height:24px;border-radius:50%;background:#ffd84d;color:#1c1450;display:grid;place-items:center;font-weight:900}
.ib{width:34px;height:34px;border-radius:50%;border:2px solid var(--edge);background:#1c1450;display:grid;place-items:center;color:#ffe08a;font-weight:800;font-size:15px}
.ib.s{width:26px;height:26px;background:#fff;color:#1c1450;border:0;font-style:italic;font-family:serif}
.row{display:flex;gap:8px;align-items:center}
.cab{position:relative;margin:4px 0 0;padding:0 18px}
.cab:before,.cab:after{content:"";position:absolute;top:0;bottom:0;width:14px;background:linear-gradient(90deg,#8a6a12,#f2c744,#8a6a12);z-index:2}
.cab:before{left:0;border-radius:0 10px 10px 0}.cab:after{right:0;border-radius:10px 0 0 10px}
.head{display:flex;justify-content:space-between;align-items:center;height:64px;padding:0 10px 0 6px;border:2px solid #7a5c14;border-radius:6px;background:linear-gradient(#2d2480,#1a1450)}
.trophy{position:relative;width:54px;height:54px;border-radius:50%;background:radial-gradient(#7a4d00,#3a2200);display:grid;place-items:center;font-size:28px}
.trophy i{position:absolute;bottom:-2px;font-style:normal;font-size:11px;font-weight:900;color:#fff}
h1{margin:0;font-size:34px;font-style:italic;font-weight:900;letter-spacing:-1px;background:linear-gradient(#fff3a0,#ffc800 50%,#c98a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #6b4a00)}
.clock{width:46px;height:46px;border-radius:50%;background:radial-gradient(#4a6dff,#1b2a8a);border:3px solid #9db4ff;display:grid;place-items:center;font-size:22px}
.board{margin-top:8px;padding:8px 12px;background:linear-gradient(#27207a,#1b1458);border-top:4px solid #5a8dff;position:relative}
.board:before,.board:after{content:"";position:absolute;top:8px;bottom:8px;width:6px;background:repeating-linear-gradient(#fff 0 6px,transparent 6px 22px);border-radius:3px;opacity:.9}
.board:before{left:3px}.board:after{right:3px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:7px}
.t{position:relative;aspect-ratio:.9;border-radius:10px;background:var(--tile);border:2px solid #3b3a86;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:hidden;padding:0;color:#fff;font:inherit}
.t .f{font-size:44px;margin-top:14px;line-height:1}
.t .m{position:absolute;bottom:3px;font-weight:900;font-size:19px;color:#a8892b;text-shadow:0 1px 0 #000}
.t.fire .m:after{content:"🔥";font-size:14px;margin-left:3px}
.t.on{border-color:#ffd700;box-shadow:0 0 12px #ffd70099 inset}
.t.hit{border-color:#ffd700;background:#5a4cc0;box-shadow:0 0 18px #ffd700,0 0 10px #ffd700 inset}
.chips{position:absolute;inset:0;pointer-events:none}
.chips u{position:absolute;width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 2px #0008}
.amt{position:absolute;top:2px;right:2px;font-size:10px;font-weight:900;background:#ffd84d;color:#3a2800;border-radius:9px;padding:1px 5px}
.mid{display:grid;grid-template-columns:1fr 1.45fr 1fr;gap:7px;margin-bottom:7px;align-items:center}
.sp{aspect-ratio:1;border-radius:10px;border:0;font:italic 900 22px/1 ui-rounded,system-ui;color:#7a4a00;text-shadow:0 1px 0 #ffe9a3;display:grid;place-items:center;position:relative;overflow:hidden;width:100%}
.lk{background:radial-gradient(#8fa8ff,#4a4fb0)}.sl{background:linear-gradient(135deg,#3fbf8a,#f2a33a 60%,#7c4ad6);}
.sp.hit{box-shadow:0 0 18px #ffd700;outline:3px solid #ffd700}
.sp span{text-align:center}
.timer{height:98px;border:5px solid #6d63d8;border-radius:14px;background:#0f0f3a;display:grid;place-items:center;position:relative;box-shadow:0 0 0 2px #1a1450}
.timer b{font:700 52px/1 'Courier New',monospace;color:#ffd21f;letter-spacing:2px}
.info{padding:8px 16px 4px;background:linear-gradient(#2c2478,#241c68)}
.win{display:flex;align-items:center;gap:12px;font-size:18px;color:#f0c64a}
.win div{flex:1;background:#14123f;border-radius:6px;text-align:center;font-weight:800;font-size:20px;color:#ffd21f;padding:2px}
.hint{text-align:center;color:#8d98ff;font-size:17px;margin:14px 0 6px}
.tray{display:flex;gap:14px;overflow-x:auto;padding:10px 12px 14px;scrollbar-width:none;background:#241c68}
.tray::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;width:68px;height:68px;border-radius:50%;border:0;position:relative;display:grid;place-items:center;font:900 15px ui-rounded,system-ui;color:#fff;transition:transform .15s}
.chip:before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--c);box-shadow:0 7px 0 var(--d),0 9px 8px #0008;border:4px solid var(--b)}
.chip em{position:relative;font-style:normal;background:var(--l,#fff);color:var(--k,#4a2b00);border-radius:50%;width:46px;height:46px;display:grid;place-items:center;border:2px solid var(--d)}
.chip.sel{transform:translateY(-6px) scale(1.12);filter:drop-shadow(0 0 10px #ffd700)}
.res{margin-top:auto;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#1f1860}
.res>span{color:#8d98ff;font-size:17px}
.rl{flex:1;display:flex;gap:8px;overflow:hidden;background:#150f45;border-radius:8px;padding:6px 8px}
.rl i{font-style:normal;font-size:28px;position:relative;flex:0 0 auto}
.rl i.n:after{content:"New";position:absolute;left:0;right:0;bottom:-6px;font-size:10px;font-weight:700;background:#f5a623;color:#fff;border-radius:6px;text-align:center}
#pop{position:absolute;inset:0;background:#000a;display:none;flex-direction:column;align-items:center;padding-top:150px;z-index:9}
#pop.show{display:flex}
.ban{width:86%;background:linear-gradient(#5a4be0,#2144c8);border:4px solid #f5c542;border-radius:16px;padding:14px;display:flex;align-items:center;gap:14px;font-size:20px;box-shadow:0 0 12px #ffd70088}
.ban i{font-style:normal;font-size:44px;padding-right:12px;border-right:1px solid #fff5}
.box{width:76%;background:linear-gradient(#3b2d99,#2a1f78);border:3px solid #f5c542;border-top:0;border-radius:0 0 14px 14px;padding:8px 14px 12px}
.u{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #6b64c0}
.u:last-child{border:0}
.u .cr{font-size:34px;width:42px;text-align:center}
.u .av{width:46px;height:46px;border-radius:50%;background:#e5e9ff;display:grid;place-items:center;font-size:26px}

.go{margin-top:14px;border:0;border-radius:99px;padding:10px 40px;font:900 15px system-ui;background:#ffd84d;color:#3a2800}
.flash{position:absolute;left:0;right:0;top:44%;text-align:center;font-weight:900;font-size:26px;color:#ffd21f;text-shadow:0 0 12px #000;z-index:8;pointer-events:none}

.chip{width:70px;height:70px}.chip:before{display:none}.chip img{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 5px #000a);transition:.15s}
.chip.sel{transform:translateY(-8px) scale(1.14);filter:drop-shadow(0 0 12px #ffd700)}.chip.sel img{filter:drop-shadow(0 0 8px #ffd700) drop-shadow(0 6px 5px #000a)}
.tray{padding:14px 12px 16px;justify-content:center;gap:12px;background:linear-gradient(#241c68,#150f45);border-top:2px solid #4a3ca8}
#app{background:radial-gradient(120% 60% at 50% 0,#3a2c9a,transparent 60%),linear-gradient(#1a1445,#17113f)}
h1{position:relative;animation:sh 4s infinite}@keyframes sh{0%,80%,100%{filter:drop-shadow(0 2px 0 #6b4a00) brightness(1)}90%{filter:drop-shadow(0 2px 0 #6b4a00) brightness(1.5)}}
.t{background:linear-gradient(#383886,#23235a);box-shadow:inset 0 2px 0 #ffffff30,inset 0 -6px 12px #0006,0 4px 8px #0006}
.t:after{content:"";position:absolute;top:0;left:8%;right:8%;height:38%;background:linear-gradient(#ffffff2e,transparent);border-radius:0 0 12px 12px;pointer-events:none}
.t.hit{animation:pul .35s infinite alternate}@keyframes pul{to{transform:scale(1.05)}}
.board:before,.board:after{animation:bl 1s infinite alternate}@keyframes bl{from{opacity:.55}to{opacity:1}}
.timer b.hot{color:#ff5252;animation:pul .4s infinite alternate}
#cf{position:absolute;inset:0;pointer-events:none;z-index:12;width:100%;height:100%}
.big{position:absolute;left:0;right:0;top:34%;text-align:center;z-index:13;pointer-events:none;font-size:46px;font-weight:900;background:linear-gradient(#fff3a0,#ffc800 55%,#c98a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #6b4a00) drop-shadow(0 0 18px #ffd700);animation:pop 1.8s forwards}
.big small{display:block;font-size:26px}@keyframes pop{0%{transform:scale(.3);opacity:0}20%{transform:scale(1.15);opacity:1}35%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.dia{width:28px;height:28px;filter:drop-shadow(0 0 6px #b36bff)}
.pill{background:linear-gradient(#2e2380,#150f45);box-shadow:inset 0 1px 0 #ffffff40,0 0 10px #c9a22744;min-width:150px}
.pill b{font-size:15px;letter-spacing:.3px;color:#fff;text-shadow:0 1px 2px #000}
.pill.flip{animation:fl2 .35s}@keyframes fl2{40%{box-shadow:0 0 18px #ffd700,inset 0 1px 0 #fff6;transform:scale(1.04)}}
.plus{background:linear-gradient(#fff0a0,#f2b400);box-shadow:0 2px 4px #0008,inset 0 1px 0 #fff}
.top{background:linear-gradient(#150f35,#0c0820);border-bottom:2px solid #3a2f8a}
.head{background:linear-gradient(#3a2fa0,#1a1450);box-shadow:inset 0 2px 0 #ffffff30,0 4px 10px #0008;border-color:#c9a227}
.chips img{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;filter:drop-shadow(0 2px 2px #000b);transform:none}
.t.on,.sp.on{box-shadow:0 0 0 2px #ffd700,0 0 16px #ffd70088,inset 0 0 14px #ffd70033}
.t .f{filter:drop-shadow(0 4px 3px #0009)}
.amt{top:3px;right:auto;left:50%;transform:translateX(-50%);z-index:20;background:linear-gradient(#fff0a0,#f2b400);border:1px solid #fff6c9;box-shadow:0 2px 4px #0009;font-size:11px;padding:1px 7px;white-space:nowrap}
.t .m{z-index:2;font-size:18px;color:#d9b445}
.board{background:linear-gradient(#2b237f,#1a1458);box-shadow:inset 0 0 30px #0007}
.timer{background:radial-gradient(#1c1c5e,#090930);box-shadow:0 0 0 2px #1a1450,0 0 18px #6d63d855,inset 0 0 14px #000}
.timer b{text-shadow:0 0 14px #ffd21f}
.win div{background:linear-gradient(#0e0c33,#1a1650);border:1px solid #4a3ca8;box-shadow:inset 0 2px 6px #000}

/* Focused UI polish: preserve existing game logic and layout. */
html,body{min-height:100%;overflow-x:hidden}
#app{width:100%;height:100dvh;min-height:0;overflow:hidden;}
.top{gap:6px;flex-wrap:nowrap;padding:5px 7px}
.pill{min-width:0;gap:5px;padding:2px 4px 2px 6px}
.pill b{min-width:0;font-size:13px}
.dia{width:24px;height:24px;object-fit:contain;background:transparent}
.board{padding:7px 10px;margin-top:6px}
.g{gap:5px;margin-bottom:5px}
.t{min-width:0;border-radius:8px}
.t .f{font-size:clamp(28px,9vw,40px);margin-top:clamp(8px,2.5vw,12px)}
.t .m{font-size:15px}
.amt{font-size:9px;padding:0 4px;line-height:15px;min-height:15px;border-radius:7px;background:rgba(255,216,77,.82);border:1px solid rgba(255,246,201,.7);box-shadow:0 1px 3px #0007;max-width:calc(100% - 4px);overflow:hidden;text-overflow:ellipsis}
.chips img{width:23px;height:23px;margin:-11.5px 0 0 -11.5px;object-fit:contain;background:transparent}
.timer{height:clamp(70px,19vw,88px);border-width:4px}
.timer b{font-size:clamp(36px,11vw,46px);letter-spacing:1px}
.mid{gap:5px;margin-bottom:5px}
.sp{font-size:clamp(17px,5vw,21px)}
.info{padding:6px 12px 3px}
.win{gap:8px;font-size:15px}
.win div{font-size:17px}
.hint{font-size:14px;margin:8px 0 4px}
.tray{gap:9px;padding:9px 10px 11px;justify-content:space-around}
.chip{width:clamp(48px,15vw,62px);height:clamp(48px,15vw,62px);max-width:19vw}
.chip img{width:100%;height:100%;object-fit:contain;background:transparent}
.chip.sel{transform:translateY(-4px) scale(1.06)}
.res{gap:7px;padding:6px 9px}
.res>span{font-size:14px;white-space:nowrap}
.rl{gap:5px;padding:4px 6px;min-width:0}
.rl i{font-size:23px}
#pop{padding: max(70px,12vh) 12px 20px;justify-content:center;overflow-y:auto}
.ban{width:min(92%,360px);padding:10px;gap:10px;font-size:17px}
.ban i{font-size:36px;padding-right:9px}
.box{width:min(88%,330px);padding:6px 10px 9px}
.u{gap:7px;padding:7px 0}
.u .cr{font-size:27px;width:32px}
.u .av{width:38px;height:38px;font-size:22px;flex:0 0 38px}
.u .nm{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u .d{font-size:14px;white-space:nowrap}
.u .d:before{width:17px;height:17px}
.go{margin-top:10px;padding:9px 32px}
.big{font-size:38px}
.big small{font-size:21px}
@media(max-width:360px){
 h1{font-size:27px}.t .f{font-size:28px}.t .m{font-size:13px}
 .pill b{font-size:12px}.ib{width:30px;height:30px}
 .tray{gap:6px;padding-left:7px;padding-right:7px}
 .amt{font-size:8px;padding:0 3px}
}
@media(min-height:780px){#app{min-height:100dvh}.board{margin-top:8px}.t .f{margin-top:12px}}


@media(max-height:740px){
 #app{padding-bottom:env(safe-area-inset-bottom,0px)}
 .head{height:54px}.trophy{width:46px;height:46px;font-size:24px}h1{font-size:clamp(24px,7vw,30px)}
 .board{padding:5px 8px;margin-top:3px}.g{gap:4px;margin-bottom:4px}.t .f{font-size:clamp(24px,7.5vw,34px);margin-top:2px}.t .m{font-size:13px}
 .mid{gap:4px;margin-bottom:4px}.timer{height:clamp(54px,13vh,72px)}.timer b{font-size:clamp(30px,8vh,40px)}
 .info{padding:4px 9px 2px}.hint{margin:4px 0 2px;font-size:12px}.tray{padding:5px 8px 7px;gap:7px}.chip{width:clamp(42px,12vw,54px);height:clamp(42px,12vw,54px)}
 .res{padding:4px 7px}.rl i{font-size:20px}
}
@media(max-height:640px){
 .top{padding:3px 6px}.ib{width:28px;height:28px}.dia{width:20px;height:20px}
 .cab{margin-top:2px}.head{height:46px}.trophy{width:38px;height:38px;font-size:20px}h1{font-size:23px}.clock{width:38px;height:38px;font-size:18px}
 .board{padding:3px 7px;margin-top:2px}.t .f{font-size:24px;margin-top:0}.t .m{font-size:11px}.mid{grid-template-columns:1fr 1.2fr 1fr}.timer{height:48px;border-width:3px}.timer b{font-size:28px}
 .info{padding:3px 8px 1px}.win{font-size:12px}.win div{font-size:14px}.hint{display:none}.tray{padding:3px 7px 5px}.chip{width:40px;height:40px}.res>span{font-size:12px}.rl{padding:3px 5px}.rl i{font-size:18px}
}

/* ===== Ranking Jackpot + Game records (added) ===== */
.trophy,.clock{cursor:pointer}
.gm{width:20px;height:20px;object-fit:contain;vertical-align:middle;filter:drop-shadow(0 0 4px #b36bff)}
#mod{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:14px;z-index:30}
#mod.show{display:flex}
.card{position:relative;width:100%;max-height:94%;display:flex;flex-direction:column;border-radius:18px;border:3px solid #d9a92a;background:linear-gradient(#3a2f9e,#241a70 40%,#1a1352);box-shadow:0 0 30px #000,0 0 20px #d9a92a44;padding:12px 12px 14px}
.x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:2px solid #7d78d8;background:#150f45;color:#fff;font-weight:900;font-size:16px;z-index:2;cursor:pointer}
.ttl{margin:2px 0 8px;text-align:center;font-size:30px;font-style:italic;font-weight:900;background:linear-gradient(#fff3a0,#ffc400 55%,#b87a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #6b4a00)}
.sub{margin:-6px 0 10px;text-align:center;font-size:19px;font-weight:800;color:#dfe3ff}
.jp{display:flex;gap:4px;align-items:center;justify-content:center;border:4px solid #ff9d1c;border-radius:14px;background:#0d0a33;padding:8px;box-shadow:0 0 14px #ff9d1c88}
.jp .gm{width:30px;height:30px;margin-right:2px}
.jp b{width:26px;height:38px;border-radius:5px;background:linear-gradient(#1a1a60,#0a0a38);display:grid;place-items:center;font-size:25px;color:#ffd21f;text-shadow:0 0 8px #ffb300}.jp b.z{color:#3b3b78;text-shadow:none}
.cd{width:62%;margin:10px auto;text-align:center;background:#150f45;border-radius:99px;padding:5px;font-size:18px;color:#dfe3ff}
.desc{text-align:center;font-size:15px;line-height:1.3;margin:2px 4px 10px}
.tbl{background:#150f45;border-radius:12px;padding:6px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.th,.lr{display:grid;grid-template-columns:62px 1fr 128px;align-items:center}
.th{color:#8d98ff;font-size:14px;padding:4px 4px 6px}
.lb{overflow-y:auto;max-height:262px;display:flex;flex-direction:column;gap:6px}
.lr{height:50px;border-radius:8px;color:#1a1450;font-weight:800;flex:0 0 auto;font-size:15px}
.lr .p{display:flex;align-items:center;gap:7px;padding-left:5px;min-width:0}.lr .p span{width:30px;height:30px;border-radius:50%;background:radial-gradient(#fff,#bcc2ff);display:grid;place-items:center;font-size:17px;flex:0 0 30px}
.lr .p em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .a{display:flex;align-items:center;gap:5px}
.rk{text-align:center;font-size:20px}.r1 .rk,.r2 .rk,.r3 .rk{width:34px;height:34px;margin:auto;border-radius:50%;line-height:34px;font-size:18px;color:#fff;text-shadow:0 1px 2px #0008;box-shadow:inset 0 0 0 3px #fff6}
.r1{background:linear-gradient(90deg,#f8b53a,#ffd36b);color:#2a1800}.r1 .rk{background:#c78a00}
.r2{background:linear-gradient(90deg,#4aa8e8,#8fd3f4)}.r2 .rk{background:#2a7fbf}
.r3{background:linear-gradient(90deg,#c9805f,#e8b09a)}.r3 .rk{background:#a4553a}
.r4{background:linear-gradient(90deg,#aab0d8,#d3d6ee)}
.me{background:linear-gradient(#6a7cff,#3a44c8);color:#fff;border:2px solid #ffd54a;margin-top:6px;flex:0 0 auto}
.tabs{display:flex;gap:14px;margin-top:12px}
.tabs button{flex:1;height:44px;border-radius:8px;border:2px solid #d9a92a;background:linear-gradient(#4a58d0,#28308f);font-size:18px;color:#c9cffa;cursor:pointer}
.tabs button.sel{background:linear-gradient(#6b7cff,#3a46d6);color:#fff;box-shadow:0 0 12px #6b7cff}
.recs{overflow-y:auto;display:flex;flex-direction:column;gap:12px;max-height:68dvh;padding-top:2px}
.rc{position:relative;flex:0 0 auto;border:2px solid #3f5fd8;border-radius:12px;background:linear-gradient(#2f2a8a,#3a3396);padding:12px;overflow:hidden}
.rc .h{display:flex;justify-content:space-between;font-size:16px;padding-bottom:8px;border-bottom:1px solid #5a63d0;margin-bottom:8px}.rc .h span:last-child{color:#8d98ff;font-size:13px}
.rc label{display:block;color:#8d98ff;font-size:16px;margin:8px 0 5px}
.fl{display:flex;flex-wrap:wrap;gap:6px}.fl div{display:flex;align-items:center;gap:4px;background:#1e1a6a;border-radius:7px;padding:3px 8px 3px 5px;font-size:16px}.fl i{font-style:normal;font-size:20px}
.rc .v{display:flex;align-items:center;gap:8px;font-size:18px}
.stamp{position:absolute;right:-6px;bottom:8px;border:3px solid #5560d8;border-radius:10px;padding:2px 14px;font-size:30px;font-weight:900;color:#5560d8;transform:rotate(-14deg);opacity:.55}
.empty{text-align:center;color:#8d98ff;padding:24px}

/* fruit images */
.t .f{display:flex;align-items:center;justify-content:center;width:84%;height:calc(100% - 26px);margin-top:5px;font-size:34px;line-height:1}
.t .f img{filter:drop-shadow(0 4px 3px #0009);pointer-events:none}
.rl i{display:grid;place-items:center}.rl i img{pointer-events:none}
.ban i{display:grid;place-items:center;width:58px}
.fl i{display:grid;place-items:center}
.sp{cursor:not-allowed}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}.p .av{display:inline-flex;align-items:center;justify-content:center;overflow:hidden}

const $=s=>document.querySelector(s),fm=n=>n>=1e6?(n/1e6)+'M':n>=1e3?(n/1e3)+'K':''+n;
function tile(x,cls){const b=document.createElement('button');b.className='t'+(x.fire?' fire':'');b.dataset.id=x.id;b.innerHTML=`<span class="f">${ico(x.id)}</span><span class="m">x${x.m}</span><div class="chips"></div>`;return b}
F.forEach(x=>$('#g1').append(tile(x)));B.forEach(x=>$('#g2').append(tile(x)));
C.forEach(c=>{const b=document.createElement('button');b.className='chip'+(c.v===chip?' sel':'');b.dataset.v=c.v;b.innerHTML=`<img src="${IMG[c.l]}" alt="${c.l}">`;$('#tray').append(b)});

let AC=null,mute=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,ty='sine',v=.15,at=0,sl=0){if(mute)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),n=a.currentTime+at;o.type=ty;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(sl,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g).connect(a.destination);o.start(n);o.stop(n+d+.02)}
const SFX={chip(){tone(1400,.05,'triangle',.18);tone(2100,.07,'triangle',.1,.03)},sel(){tone(660,.08,'square',.06)},tick(){tone(900,.05,'square',.08)},warn(){tone(1200,.12,'square',.1)},
 spin(){tone(500+Math.random()*200,.04,'triangle',.1)},stop(){tone(220,.25,'sawtooth',.12,0,110)},
 win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.28,'triangle',.18,i*.1));[1047,1319,1568].forEach((f,i)=>tone(f,.5,'sine',.12,.55+i*.08))},
 big(){SFX.win();for(let i=0;i<14;i++)tone(1800+Math.random()*1800,.06,'triangle',.07,.2+i*.07)},lose(){tone(330,.2,'sawtooth',.1,0,220);tone(220,.35,'sawtooth',.1,.18,140)},err(){tone(180,.15,'square',.1)}};
const cv=$('#cf'),cx=cv.getContext('2d');let ps=[],raf=0;
function burst(n){cv.width=cv.clientWidth;cv.height=cv.clientHeight;for(let i=0;i<n;i++)ps.push({x:cv.width/2,y:cv.height*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,r:3+Math.random()*4,c:['#ffd700','#ff4d6d','#4aa8ff','#2ecf8a','#fff','#c084fc'][i%6],l:90+Math.random()*50});if(!raf)loop()}
function loop(){cx.clearRect(0,0,cv.width,cv.height);ps=ps.filter(p=>p.l-->0);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;cx.globalAlpha=Math.min(1,p.l/30);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.r,p.r*1.6)});raf=ps.length?requestAnimationFrame(loop):0}
function big(w){const d=document.createElement('div');d.className='big';d.innerHTML=`WIN!<small>+${w.toLocaleString()}</small>`;$('#app').append(d);setTimeout(()=>d.remove(),1900)}
$('#snd').onclick=()=>{mute=!mute;$('#snd').textContent=mute?'🔇':'🔊';if(!mute)SFX.sel()};
let shown=null,tf=0;function tweenBal(){if(shown===null)shown=bal;cancelAnimationFrame(tf);(function st(){shown+=(bal-shown)*.22;if(Math.abs(bal-shown)<1)shown=bal;$('#bal').textContent=Math.round(shown).toLocaleString();if(shown!==bal)tf=requestAnimationFrame(st)})();const p=document.querySelector('.pill');p.classList.remove('flip');void p.offsetWidth;p.classList.add('flip')}
function draw(){
 if(shown!==bal)tweenBal();$('#tw').textContent=tw.toLocaleString();$('#tm').textContent=String(t).padStart(2,'0');
 document.querySelectorAll('[data-id]').forEach(el=>{const a=bets[el.dataset.id]||0;el.classList.toggle('on',a>0);const ch=el.querySelector('.chips');if(!ch)return;
  let h='';if(a){const lv=C.filter(c=>c.v<=a).pop()||C[0];const n=Math.min(7,Math.max(1,Math.round(a/lv.v)));
   for(let i=0;i<n;i++){const an=i/n*6.2832-1.5708,R=n===1?0:(n<4?11:17);h+=`<img src="${IMG[lv.l]}" style="left:calc(50% + ${(Math.cos(an)*R).toFixed(1)}px);top:calc(44% + ${(Math.sin(an)*R).toFixed(1)}px);z-index:${i}">`}
   if(n>=4)h+=`<img src="${IMG[lv.l]}" style="left:50%;top:44%;z-index:9">`;
   h+=`<span class="amt">${fm(a)}</span>`}
  ch.innerHTML=h});
 $('#rl').innerHTML=hist.map((e,i)=>`<i class="${i?'':'n'}">${ico(e,28)}</i>`).join('');
 document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('sel',+c.dataset.v===chip));
}
document.addEventListener('click',async e=>{
 const c=e.target.closest('.chip');if(c){chip=+c.dataset.v;SFX.sel();draw();return}
 const x=e.target.closest('[data-id]');if(x&&!busy&&t>0){if(x.dataset.id==='lucky'||x.dataset.id==='super'){SFX.err();flash('Lucky tiles cannot be bet on');return}if(betPending)return;if(bal<chip){SFX.err();flash('Not enough Diamonds');return}if(!Object.keys(bets).length)startBal=bal;const id=x.dataset.id,amount=chip;betPending=true;document.querySelectorAll('[data-id]').forEach(el=>el.disabled=true);try{const result=await api('/api/lucky-fruit/bet',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fruit:id,amount})});bal=Number(result.balance);bets={...(result.bets||bets)};serverState={...(serverState||{}),activeBets:bets,balance:bal};SFX.chip();draw()}catch(err){flash(err.message||'Bet was not accepted');await loadServerState()}finally{betPending=false;document.querySelectorAll('[data-id]').forEach(el=>el.disabled=false)}}
 if(e.target.id==='add'){try{parent.postMessage({type:'pp-wallet:open'},location.origin)}catch(_){};flash('Recharge from your wallet')}
});
function flash(s){const f=$('#fl');f.textContent=s;setTimeout(()=>f.textContent='',1200)}
function pick(){const w=[];ALL.forEach(x=>w.push([x.id,100/x.m]));w.push(['lucky',3],['super',1.2]);let s=w.reduce((a,b)=>a+b[1],0),r=Math.random()*s;for(const[i,v]of w){if((r-=v)<0)return i}return 'orange'}
const order=['orange','banana','grape','cherry','super','apple','melon','mango','straw','lucky'];
function spin(win,done){busy=true;let i=0,total=order.length*2+order.indexOf(win)+1,step=0;
 (function go(){document.querySelectorAll('.hit').forEach(n=>n.classList.remove('hit'));const id=order[i%order.length];document.querySelector(`[data-id="${id}"]`).classList.add('hit');
  SFX.spin();i++;step++;if(step<total)setTimeout(go,60+step*7);else{SFX.stop();setTimeout(done,500)}})()}
function authHeaders(){try{const t=localStorage.getItem('pp_auth_token')||(parent&&parent!==window?parent.localStorage.getItem('pp_auth_token'):'');return t?{'Authorization':'Bearer '+t}:{}}catch(_){return {}}}
async function api(path,opts={}){const r=await fetch(path,{credentials:'same-origin',cache:'no-store',...opts,headers:{...authHeaders(),...(opts.headers||{})}});const d=await r.json().catch(()=>({success:false,message:'Invalid server response'}));if(!r.ok||!d.success)throw Error(d.message||'Server request failed');return d}
async function loadServerState(){try{serverState=await api('/api/lucky-fruit/state');bal=Number(serverState.balance)||0;if(!busy){bets={...(serverState.activeBets||{})}}hist=(serverState.history||[]).map(r=>r.fruit).filter(Boolean).slice(0,10);renderWinners(serverState.winners||[]);draw()}catch(e){bal=0;$('#fl').textContent='Login required or server wallet unavailable';$('#go').disabled=true;document.querySelectorAll('[data-id]').forEach(x=>x.disabled=true)}}
async function playServerRound(){if(spinPending||busy)return;spinPending=true;busy=true;$('#go').disabled=true;try{const result=await api('/api/lucky-fruit/spin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bets})});lastResult=result;serverState={...(serverState||{}),...result};bal=Number(result.balance)||0;const w=result.fruit;spin(w,()=>settle(w));}catch(e){flash(e.message||'Bet failed');bets={};t=15;busy=false;spinPending=false;$('#go').disabled=false;await loadServerState()} }
function tick(){
 jpTick();if(busy)return;t--;if(t<0)t=0;draw();$('#tm').classList.toggle('hot',t>0&&t<=5);if(t>0&&t<=5)SFX.warn();else if(t>5)SFX.tick();
 if(t===0){if(Object.keys(bets).length)playServerRound();else{flash('Place a bet to play');t=15;draw()}}
}
const TOP=['orange','banana','grape','cherry'],BOT=['straw','mango','melon','apple'];
function settle(w){const grp=w==='lucky'?TOP:w==='super'?BOT:null;if(grp)grp.forEach(id=>{const el=document.querySelector(`[data-id="${id}"]`);if(el)el.classList.add('hit')});
 const bet=Object.values(bets).reduce((a,b)=>a+b,0),won=lastResult?.win||0;bal=Number.isFinite(Number(lastResult?.balance))?Number(lastResult.balance):bal;tw+=won;hist=[w,...hist].slice(0,10);
 const me=won>0?won:0;
 $('#pi').innerHTML=ico(w,48);
 $('#pm').textContent=!bet?'You did not bet in this round':won?'You won '+won.toLocaleString():'Better luck next time';
 renderWinners(serverState?.winners||[]);
 $('#pop').classList.add('show');if(won){(won>=bet*10||won>=1e6?SFX.big:SFX.win)();burst(won>=1e6?160:90);big(won)}else if(bet)SFX.lose();draw();cont=setTimeout(next,4000);
}
function next(){clearTimeout(cont);$('#pop').classList.remove('show');document.querySelectorAll('.hit').forEach(n=>n.classList.remove('hit'));bets={};t=15;busy=false;spinPending=false;lastResult=null;$('#go').disabled=false;draw();loadServerState()}
$('#go').onclick=next;

let played=0,jp=0,rn=0,startBal=0,modal='',tab=0,lastResult=null;
function recordRound(w,bet,won){played+=bet}
function renderWinners(rows){const list=(rows||[]).slice(0,3);$('#pb').innerHTML=list.length?list.map((u,i)=>{const avatar=u.avatar||u.avatarUrl||u.photo||u.photoURL||u.profileImage||u.profilePic||u.profilePhoto||u.image||u.userPhoto||null;return `<div class="u"><span class="cr">${['👑','🥈','🥉'][i]}</span><span class="av">${avatar?`<img loading="lazy" src="${String(avatar).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" alt="" onerror="this.remove();this.parentElement.textContent='🙂'">`:'🙂'}</span><span class="nm">${esc(u.name||'Player')}</span><span class="d">${fm(Number(u.win)||0)}</span></div>`}).join(''):'<div class="u"><span class="nm">No verified winners yet</span></div>'}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function jpHTML(){return `<div class="desc">Server-backed play · ${Number(played||0).toLocaleString()} Diamonds wagered by you</div>`}
function leftT(){const n=new Date(),e=new Date(n);e.setHours(24,0,0,0);const s=Math.floor((e-n)/1000);return`${pad2(Math.floor(s/3600))}:${pad2(Math.floor(s%3600/60))}:${pad2(s%60)}`}
function rankHTML(){
 const rows=(tab?(serverState?.rankingYesterday||[]):(serverState?.rankingToday||[])).slice(0,20);
 const row=(u,i)=>{const avatar=u.avatar||u.avatarUrl||u.photo||u.photoURL||u.profileImage||u.profilePic||u.profilePhoto||u.image||u.userPhoto||null;return `<div class="lr ${i<3?'r'+(i+1):'r4'}"><div class="rk">${i+1}</div><div class="p"><span class="av">${avatar?`<img loading="lazy" src="${esc(avatar)}" alt="" onerror="this.remove();this.parentElement.textContent='🙂'">`:'🙂'}</span><em>${esc(u.name||'Player')}</em></div><div class="a">${gem}${Number(u.totalBet||0).toLocaleString()}</div></div>`};
 return`<button class="x" data-act="close">✕</button><div class="ttl">Lucky Fruit Ranking</div><div class="desc">Verified server-recorded bets only. No sample players or demo scores.</div><div class="tbl"><div class="th"><span>Rank</span><span>Name</span><span>Diamonds Bet</span></div><div class="lb">${rows.length?rows.map(row).join(''):'<div class="empty">No ranking records yet.</div>'}</div></div><div class="tabs"><button class="${tab?'':'sel'}" data-act="t0">Today</button><button class="${tab?'sel':''}" data-act="t1">Yesterday</button></div>`;
}
function recHTML(){
 const rows=serverState?.history||[];
 const card=r=>`<div class="rc"><div class="h"><span>Round: ${esc(r.roundId||'—')}</span><span>${new Date(r.at||0).toLocaleString()}</span></div><label>Selected fruits:</label><div class="fl">${Object.entries(r.bets||{}).map(([id,a])=>`<div><i>${ico(id,24)}</i>${Number(a).toLocaleString()}</div>`).join('')}</div><label>Winning fruit:</label><div class="fl"><div style="background:none;padding:0"><i>${ico(r.fruit,30)}</i></div></div><label>Win Diamonds:</label><div class="v">${gem}${Number(r.win||0).toLocaleString()}</div><label>Diamonds Balance:</label><div class="v">${gem}${Number(r.balanceBefore||0).toLocaleString()} → ${Number(r.balanceAfter||0).toLocaleString()}</div><div class="stamp">${r.win?'WIN':'LOSE'}</div></div>`;
